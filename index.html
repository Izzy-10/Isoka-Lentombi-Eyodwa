<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Match</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0A0908;
      color: #FFF8E1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .splash {
      text-align: center;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .crown {
      font-size: 80px;
      display: block;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    h1 {
      font-size: 42px;
      color: #FFD700;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(255,215,0,0.5);
    }

    .subtitle {
      color: #C9B78A;
      font-size: 16px;
      margin-bottom: 40px;
      letter-spacing: 1px;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 45px;
      flex-wrap: wrap;
    }

    .feature { text-align: center; color: #C9B78A; }
    .feature .f-icon { font-size: 28px; display: block; margin-bottom: 6px; }
    .feature span { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 320px;
      margin: 0 auto;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-google {
      background: #fff;
      color: #0A0908;
    }
    .btn-google:hover {
      background: #f0f0f0;
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(255,255,255,0.2);
    }

    .btn-google img {
      width: 22px;
      height: 22px;
    }

    .btn-gold {
      background: #FFD700;
      color: #0A0908;
    }
    .btn-gold:hover {
      background: #FFC200;
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(255,215,0,0.4);
    }

    .divider {
      color: #5a4a2a;
      font-size: 13px;
      text-align: center;
    }

    .loading {
      display: none;
      color: #FFD700;
      font-size: 14px;
      margin-top: 15px;
    }

    .error-msg {
      display: none;
      color: #ff6b6b;
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
    }

    .footer {
      margin-top: 50px;
      color: #2a1f0f;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="splash">
    <span class="crown">👑</span>
    <h1>Love Match</h1>
    <p class="subtitle">Find your royal match in Mzansi 🇿🇦</p>

    <div class="features">
      <div class="feature">
        <span class="f-icon">🔥</span>
        <span>Smart Matching</span>
      </div>
      <div class="feature">
        <span class="f-icon">💬</span>
        <span>Real Chat</span>
      </div>
      <div class="feature">
        <span class="f-icon">❤️</span>
        <span>Real People</span>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-google" id="googleBtn" onclick="signInWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
        Continue with Google
      </button>
      <div class="divider">— or —</div>
      <button class="btn btn-gold" onclick="window.location.href='login.html'">
        Login with Email 📧
      </button>
    </div>

    <div class="loading" id="loadingMsg">⏳ Signing you in...</div>
    <div class="error-msg" id="errorMsg"></div>

    <div class="footer">
      Love Match &copy; 2026 &nbsp;|&nbsp; Made with ❤️ in Mzansi
    </div>
  </div>

  <script type="module">
    import { auth, db, provider, signInWithPopup, onAuthStateChanged, doc, setDoc, getDoc } from './firebase.js';

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = 'match.html';
      }
    });

    window.signInWithGoogle = async function() {
      const loading = document.getElementById('loadingMsg');
      const errorMsg = document.getElementById('errorMsg');
      loading.style.display = 'block';
      errorMsg.style.display = 'none';

      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        const userRef = doc(db, 'users', user.uid);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
          await setDoc(userRef, {
            uid: user.uid,
            name: user.displayName,
            email: user.email,
            photo: user.photoURL,
            createdAt: new Date().toISOString(),
            profileComplete: false
          });
          window.location.href = 'profile.html';
        } else {
          const data = userSnap.data();
          if (!data.profileComplete) {
            window.location.href = 'profile.html';
          } else {
            window.location.href = 'match.html';
          }
        }
      } catch (error) {
        loading.style.display = 'none';
        errorMsg.style.display = 'block';
        errorMsg.textContent = 'Sign in failed: ' + error.message;
      }
    }
  </script>

</body>
</html>
