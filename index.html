<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Match</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0A0908;
      color: #FFF8E1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .card {
      background: #17110A;
      border: 2px solid #C9A44C;
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 10px 40px rgba(255, 215, 0, 0.1);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      font-size: 36px;
      color: #FFD700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .logo p {
      color: #C9B78A;
      font-size: 13px;
      margin-top: 5px;
      letter-spacing: 1px;
    }

    .crown {
      font-size: 40px;
      display: block;
      margin-bottom: 10px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #C9B78A;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background: #0A0908;
      color: #FFF8E1;
      border: 2px solid #C9A44C;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      transition: all 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #FFD700;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
    }

    .form-group input::placeholder {
      color: #5a4a2a;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .btn-primary {
      background: #FFD700;
      color: #0A0908;
      margin-top: 10px;
    }

    .btn-primary:hover {
      background: #FFC200;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .divider {
      text-align: center;
      margin: 20px 0;
      color: #C9A44C;
      font-size: 13px;
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #C9A44C;
    }

    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .link {
      text-align: center;
      margin-top: 20px;
      color: #C9B78A;
      font-size: 14px;
    }

    .link a {
      color: #FFD700;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }

    .link a:hover {
      text-decoration: underline;
    }

    .error {
      color: #ff6b6b;
      font-size: 13px;
      margin-top: 8px;
      text-align: center;
    }

    .forgot {
      text-align: right;
      margin-top: 8px;
    }

    .forgot a {
      color: #C9A44C;
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
    }

    .forgot a:hover {
      color: #FFD700;
    }

    /* PAGE SWITCHING */
    .page {
      display: none;
    }

    .page.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- LOGIN PAGE -->
    <div class="page active" id="loginPage">
      <div class="card">
        <div class="logo">
          <span class="crown">👑</span>
          <h1>Love Match</h1>
          <p>Find your royal match</p>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="Enter your email">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password">
          <div class="forgot">
            <a onclick="showPage('forgotPage')">Forgot password?</a>
          </div>
        </div>

        <div class="error" id="loginError"></div>

        <button class="btn btn-primary" onclick="handleLogin()">Login</button>

        <div class="link">
          Don't have an account?
          <a onclick="showPage('registerPage')">Register here</a>
        </div>
      </div>
    </div>

    <!-- REGISTER PAGE -->
    <div class="page" id="registerPage">
      <div class="card">
        <div class="logo">
          <span class="crown">👑</span>
          <h1>Join Us</h1>
          <p>Create your account</p>
        </div>

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" placeholder="Enter your name">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="Enter your email">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" placeholder="Create a password">
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="regConfirm" placeholder="Repeat your password">
        </div>

        <div class="error" id="registerError"></div>

        <button class="btn btn-primary" onclick="handleRegister()">Create Account</button>

        <div class="link">
          Already have an account?
          <a onclick="showPage('loginPage')">Login here</a>
        </div>
      </div>
    </div>

    <!-- FORGOT PASSWORD PAGE -->
    <div class="page" id="forgotPage">
      <div class="card">
        <div class="logo">
          <span class="crown">🔑</span>
          <h1>Reset</h1>
          <p>We will send you a link</p>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="forgotEmail" placeholder="Enter your email">
        </div>

        <div class="error" id="forgotError"></div>

        <button class="btn btn-primary" onclick="handleForgot()">Send Reset Link</button>

        <div class="link">
          <a onclick="showPage('loginPage')">Back to Login</a>
        </div>
      </div>
    </div>

  </div>

  <script>
    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    }

    function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const error = document.getElementById('loginError');

      if (!email || !password) {
        error.textContent = 'Please fill in all fields.';
        return;
      }

      if (!email.includes('@')) {
        error.textContent = 'Please enter a valid email.';
        return;
      }

      error.textContent = '';
      alert('Login successful! Profile page coming next.');
    }
