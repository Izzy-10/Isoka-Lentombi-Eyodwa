<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Match</title>
  <link rel="stylesheet" href="src/theme.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .splash {
      text-align: center;
      animation: fadeIn 1s ease;
      width: 100%;
      max-width: 400px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .crown {
      font-size: 80px;
      display: block;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    h1 {
      font-size: 42px;
      color: var(--gold);
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 10px;
      text-shadow: 0 0 20px var(--card-shadow);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 16px;
      margin-bottom: 40px;
      letter-spacing: 1px;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 45px;
      flex-wrap: wrap;
    }

    .feature {
      text-align: center;
      color: var(--text-muted);
    }

    .feature .f-icon {
      font-size: 28px;
      display: block;
      margin-bottom: 6px;
    }

    .feature span {
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 320px;
      margin: 0 auto;
    }

    .btn-google img {
      width: 22px;
      height: 22px;
    }

    .divider {
      color: var(--text-faint);
      font-size: 13px;
      text-align: center;
    }

    .loading-msg {
      display: none;
      margin-top: 16px;
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
    }

    .error-msg {
      display: none;
      margin-top: 16px;
      color: #e74c3c;
      font-size: 14px;
      text-align: center;
    }

    .theme-switcher {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .theme-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      padding: 0;
    }

    .theme-dot:hover {
      transform: scale(1.2);
    }

    .theme-dot.active {
      border-color: #fff;
      transform: scale(1.2);
    }

    .bottom-links {
      margin-top: 20px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .bottom-links a {
      color: var(--gold);
      text-decoration: none;
      font-weight: bold;
    }

    .bottom-links a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 40px;
      color: var(--text-faint);
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="splash">
    <span class="crown">👑</span>
    <h1>Love Match</h1>
    <p class="subtitle">Find your royal match in Mzansi 🇿🇦</p>

    <div class="features">
      <div class="feature">
        <span class="f-icon">🔥</span>
        <span>Smart Matching</span>
      </div>
      <div class="feature">
        <span class="f-icon">💬</span>
        <span>Real Chat</span>
      </div>
      <div class="feature">
        <span class="f-icon">❤️</span>
        <span>Real People</span>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-google" id="googleBtn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
        Continue with Google
      </button>

      <div class="divider">— or —</div>

      <button class="btn btn-primary" onclick="window.location.href='register.html'">
        Create Account 👑
      </button>

      <button class="btn btn-secondary" onclick="window.location.href='login.html'">
        Login with Email 📧
      </button>
    </div>

    <div class="loading-msg" id="loadingMsg">⏳ Signing you in...</div>
    <div class="error-msg" id="errorMsg"></div>

    <div class="theme-switcher">
      <button class="theme-dot" style="background:#C9A44C" data-key="classic" title="Classic"></button>
      <button class="theme-dot" style="background:#1B4332" data-key="luxury" title="Luxury"></button>
      <button class="theme-dot" style="background:#4F46E5" data-key="startup" title="Startup"></button>
      <button class="theme-dot" style="background:#C2410C" data-key="warm" title="Warm"></button>
      <button class="theme-dot" style="background:#5B8DEF" data-key="dark" title="Dark"></button>
    </div>

    <div class="bottom-links">
      Already have an account? <a href="login.html">Login here</a>
    </div>

    <div class="footer">
      Love Match &copy; 2026 &nbsp;|&nbsp; Made with ❤️ in Mzansi
    </div>
  </div>

  <script type="module">
    import { applyTheme, getTheme, setTheme } from './src/theme.js';
    applyTheme(getTheme());

    document.querySelectorAll('.theme-dot').forEach(btn => {
      if (btn.dataset.key === getTheme()) btn.classList.add('active');
      btn.addEventListener('click', () => {
        setTheme(btn.dataset.key);
        document.querySelectorAll('.theme-dot').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    import {
      auth, db, provider,
      signInWithPopup,
      onAuthStateChanged,
      doc, setDoc, getDoc
    } from './firebase.js';

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = 'match.html';
    });

    document.getElementById('googleBtn').addEventListener('click', async () => {
      const loading = document.getElementById('loadingMsg');
      const errorMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('googleBtn');

      loading.style.display = 'block';
      errorMsg.style.display = 'none';
      btn.disabled = true;
      btn.style.opacity = '0.7';

      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        const userRef = doc(db, 'users', user.uid);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
          await setDoc(userRef, {
            uid: user.uid,
            name: user.displayName,
            email: user.email,
            photo: user.photoURL,
            createdAt: new Date().toISOString(),
            profileComplete: false
          });
          window.location.href = 'profile.html';
        } else {
          const data = userSnap.data();
          window.location.href = data.profileComplete ? 'match.html' :
