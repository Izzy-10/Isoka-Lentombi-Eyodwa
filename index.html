<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Match</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0A0908;
      color: #FFF8E1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .splash {
      text-align: center;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .splash .crown {
      font-size: 80px;
      display: block;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .splash h1 {
      font-size: 42px;
      color: #FFD700;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .splash p {
      color: #C9B78A;
      font-size: 16px;
      margin-bottom: 50px;
      letter-spacing: 1px;
    }

    .splash .tagline {
      color: #5a4a2a;
      font-size: 13px;
      margin-bottom: 40px;
      font-style: italic;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 320px;
      margin: 0 auto;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      display: block;
      text-align: center;
    }

    .btn-gold {
      background: #FFD700;
      color: #0A0908;
    }
    .btn-gold:hover {
      background: #FFC200;
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(255,215,0,0.4);
    }

    .btn-outline {
      background: transparent;
      color: #FFD700;
      border: 2px solid #FFD700;
    }
    .btn-outline:hover {
      background: #FFD700;
      color: #0A0908;
      transform: translateY(-3px);
    }

    .divider {
      color: #5a4a2a;
      font-size: 13px;
      margin: 5px 0;
      text-align: center;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 45px;
      flex-wrap: wrap;
    }

    .feature {
      text-align: center;
      color: #C9B78A;
    }

    .feature .f-icon { font-size: 28px; display: block; margin-bottom: 6px; }
    .feature span { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }

    .footer {
      margin-top: 50px;
      color: #2a1f0f;
      font-size: 12px;
    }

    .glow {
      text-shadow: 0 0 20px rgba(255,215,0,0.5);
    }
  </style>
</head>
<body>

  <div class="splash">
    <span class="crown">👑</span>
    <h1 class="glow">Love Match</h1>
    <p>Find your royal match in Mzansi 🇿🇦</p>

    <div class="features">
      <div class="feature">
        <span class="f-icon">🔥</span>
        <span>Smart Matching</span>
      </div>
      <div class="feature">
        <span class="f-icon">💬</span>
        <span>Real Chat</span>
      </div>
      <div class="feature">
        <span class="f-icon">❤️</span>
        <span>Real People</span>
      </div>
    </div>

    <div class="btn-group">
      <a class="btn btn-gold" href="login.html">Login 👑</a>
      <div class="divider">— or —</div>
      <a class="btn btn-outline" href="register.html">Create Account ✨</a>
    </div>

    <div class="footer">
      Love Match &copy; 2026 &nbsp;|&nbsp; Made with ❤️ in Mzansi
    </div>
  </div>

</body>
</html>
