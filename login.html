<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Match - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0A0908;
      color: #FFF8E1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: #17110A;
      border: 2px solid #C9A44C;
      border-radius: 20px;
      padding: 40px 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 40px rgba(255,215,0,0.1);
    }

    .logo { text-align: center; margin-bottom: 30px; }
    .logo .icon { font-size: 42px; display: block; margin-bottom: 8px; }
    .logo h1 { font-size: 32px; color: #FFD700; letter-spacing: 3px; text-transform: uppercase; }
    .logo p { color: #C9B78A; font-size: 13px; margin-top: 5px; }

    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #C9B78A;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .form-group input {
      width: 100%;
      padding: 13px 15px;
      background: #0A0908;
      color: #FFF8E1;
      border: 2px solid #C9A44C;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      transition: all 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #FFD700;
      box-shadow: 0 0 15px rgba(255,215,0,0.2);
    }

    .form-group input::placeholder { color: #5a4a2a; }

    .forgot { text-align: right; margin-top: 6px; }
    .forgot a { color: #C9A44C; font-size: 12px; cursor: pointer; text-decoration: none; }
    .forgot a:hover { color: #FFD700; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .btn-gold { background: #FFD700; color: #0A0908; }
    .btn-gold:hover {
      background: #FFC200;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255,215,0,0.4);
    }

    .link { text-align: center; margin-top: 18px; color: #C9B78A; font-size: 14px; }
    .link a { color: #FFD700; text-decoration: none; font-weight: bold; }
    .link a:hover { text-decoration: underline; }

    .msg-error { color: #ff6b6b; font-size: 13px; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">
      <span class="icon">👑</span>
      <h1>Love Match</h1>
      <p>Find your royal match</p>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="Enter your email">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Enter your password">
      <div class="forgot">
        <a href="forgot.html">Forgot password?</a>
      </div>
    </div>

    <div class="msg-error" id="loginError"></div>

    <button class="btn btn-gold" onclick="handleLogin()">Login</button>

    <div class="link">
      Don't have an account? <a href="register.html">Register here</a>
    </div>
  </div>

  <script>
    function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const error = document.getElementById('loginError');

      if (!email || !password) {
        error.textContent = 'Please fill in all fields.';
        return;
      }

      if (!email.includes('@')) {
        error.textContent = 'Please enter a valid email.';
        return;
      }

      error.textContent = '';
      window.location.href = 'match.html';
    }
  </script>

</body>
</html>
