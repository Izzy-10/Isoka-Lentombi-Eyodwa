<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Match - Login</title>
  <link rel="stylesheet" href="src/theme.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      padding: 40px 30px;
      width: 100%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo .icon {
      font-size: 42px;
      display: block;
      margin-bottom: 8px;
    }

    .logo h1 {
      font-size: 32px;
      color: var(--gold);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .logo p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 5px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: var(--text-muted);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .forgot {
      text-align: right;
      margin-top: 6px;
    }

    .forgot a {
      color: var(--accent);
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
    }

    .forgot a:hover {
      color: var(--gold);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .btn-google img {
      width: 20px;
      height: 20px;
    }

    .link {
      text-align: center;
      margin-top: 20px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .link a {
      color: var(--gold);
      text-decoration: none;
      font-weight: bold;
    }

    .link a:hover {
      text-decoration: underline;
    }

    .back-link {
      text-align: center;
      margin-top: 12px;
    }

    .back-link a {
      color: var(--text-faint);
      font-size: 12px;
      text-decoration: none;
    }

    .back-link a:hover {
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">
      <span class="icon">👑</span>
      <h1>Love Match</h1>
      <p>Find your royal match</p>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input class="input" type="email" id="loginEmail" placeholder="Enter your email">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input class="input" type="password" id="loginPassword" placeholder="Enter your password">
      <div class="forgot">
        <a href="forgot.html">Forgot password?</a>
      </div>
    </div>

    <div class="error-msg" id="loginError"></div>

    <div class="btn-group">
      <button class="btn btn-primary" id="loginBtn">Login 👑</button>
      <div class="divider">— or —</div>
      <button class="btn btn-google" id="googleBtn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
        Continue with Google
      </button>
    </div>

    <div class="link">
      Don't have an account? <a href="register.html">Register here</a>
    </div>

    <div class="back-link">
      <a href="index.html">← Back to home</a>
    </div>
  </div>

  <script type="module">
    import { applyTheme, getTheme } from './src/theme.js';
    applyTheme(getTheme());

    import {
      auth,
      db,
      provider,
      signInWithPopup,
      onAuthStateChanged,
      doc,
      getDoc
    } from './firebase.js';

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = 'match.html';
    });

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const errorEl = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');

      errorEl.style.display = 'none';

      if (!email || !password) {
        errorEl.textContent = 'Please fill in all fields.';
        errorEl.style.display = 'block';
        return;
      }

      btn.textContent = 'Logging in...';
      btn.disabled = true;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        const user = auth.currentUser;
        const snap = await getDoc(doc(db, 'users', user.uid));
        if (snap.exists() && snap.data().profileComplete) {
          window.location.href = 'match.html';
        } else {
          window.location.href = 'profile.html';
        }
      } catch (err) {
        btn.textContent = 'Login 👑';
        btn.disabled = false;
        errorEl.style.display = 'block';
        if (err.code === 'auth/user-not-found') {
          errorEl.textContent = 'No account found with this email.';
        } else if (err.code === 'auth/wrong-password') {
          errorEl.textContent = 'Wrong password. Try again.';
        } else if (err.code === 'auth/invalid-email') {
          errorEl.textContent = 'Invalid email address.';
        } else {
          errorEl.textContent = err.message;
        }
      }
    });

    document.getElementById('googleBtn').addEventListener('click', async () => {
      const errorEl = document.getElementById('loginError');
      errorEl.style.display = 'none';

      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        const snap = await getDoc(doc(db, 'users', user.uid));

        if (!snap.exists()) {
          const { setDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
          await setDoc(doc(db, 'users', user.uid), {
            uid: user.uid,
            name: user.displayName,
            email: user.email,
            photo: user.photoURL,
            createdAt: new Date().toISOString(),
            profileComplete: false
          });
          window.location.href = 'profile.html';
        } else {
          const data = snap.data();
          window.location.href = data.profileComplete ? 'match.html' : 'profile.html';
        }
      } catch (err) {
        errorEl.style.display = 'block';
        errorEl.textContent = 'Google sign in failed: ' + err.message;
      }
    });
  </script>

</body>
</html>
