<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Match - Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0A0908;
      color: #FFF8E1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: #17110A;
      border-bottom: 2px solid #C9A44C;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .navbar h2 { color: #FFD700; font-size: 20px; letter-spacing: 2px; }
    .nav-icons { display: flex; gap: 18px; }
    .nav-icons span { font-size: 22px; cursor: pointer; transition: transform 0.2s; }
    .nav-icons span:hover { transform: scale(1.2); }

    .chat-list {
      display: flex;
      flex-direction: column;
      padding: 15px;
      gap: 10px;
    }

    .chat-list-title {
      color: #C9A44C;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 10px 5px 5px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      background: #17110A;
      border: 1px solid #C9A44C;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .chat-item:hover {
      border-color: #FFD700;
      box-shadow: 0 4px 20px rgba(255,215,0,0.15);
      transform: translateX(4px);
    }

    .chat-avatar {
      font-size: 40px;
      width: 55px;
      height: 55px;
      background: #0A0908;
      border: 2px solid #C9A44C;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .chat-info { flex: 1; }
    .chat-info h3 { color: #FFD700; font-size: 16px; margin-bottom: 4px; }
    .chat-info p { color: #C9B78A; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }

    .chat-meta { text-align: right; }
    .chat-meta .time { color: #5a4a2a; font-size: 11px; margin-bottom: 6px; }
    .chat-meta .badge {
      background: #FFD700;
      color: #0A0908;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 20px;
    }

    .chat-window {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    .chat-window.open { display: flex; }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: #17110A;
      border-bottom: 2px solid #C9A44C;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .chat-header .back {
      font-size: 22px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .chat-header .back:hover { transform: scale(1.2); }

    .chat-header .avatar {
      font-size: 32px;
      width: 45px;
      height: 45px;
      background: #0A0908;
      border: 2px solid #FFD700;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-header .info h3 { color: #FFD700; font-size: 16px; }
    .chat-header .info p { color: #51cf66; font-size: 12px; }

    .messages {
      flex: 1;
      padding: 20px 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: #C9A44C; border-radius: 4px; }

    .msg {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      position: relative;
    }

    .msg.received {
      background: #17110A;
      border: 1px solid #C9A44C;
      color: #FFF8E1;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.sent {
      background: #FFD700;
      color: #0A0908;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      font-weight: 500;
    }

    .msg .msg-time {
      font-size: 10px;
      margin-top: 5px;
      opacity: 0.6;
      text-align: right;
    }

    .msg.received .msg-time { text-align: left; }

    .chat-input-area {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px;
      background: #17110A;
      border-top: 2px solid #C9A44C;
    }

    .chat-input-area input {
      flex: 1;
      padding: 13px 16px;
      background: #0A0908;
      color: #FFF8E1;
      border: 2px solid #C9A44C;
      border-radius: 25px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.3s;
    }

    .chat-input-area input:focus {
      outline: none;
      border-color: #FFD700;
    }

    .chat-input-area input::placeholder { color: #5a4a2a; }

    .send-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #FFD700;
      border: none;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: #FFC200;
      transform: scale(1.1);
    }

    .empty-chat {
      text-align: center;
      padding: 60px 20px;
      color: #C9B78A;
    }
    .empty-chat .icon { font-size: 60px; display: block; margin-bottom: 15px; }
    .empty-chat h3 { color: #FFD700; font-size: 20px; margin-bottom: 10px; }
    .empty-chat p { font-size: 14px; }
  </style>
</head>
