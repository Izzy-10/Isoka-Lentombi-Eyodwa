<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Match - Chat</title>
  <link rel="stylesheet" href="src/theme.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .chat-list {
      display: flex;
      flex-direction: column;
      padding: 15px;
      gap: 10px;
    }

    .chat-list-title {
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 10px 5px 5px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .chat-item:hover {
      border-color: var(--gold);
      box-shadow: 0 4px 20px var(--card-shadow);
      transform: translateX(4px);
    }

    .chat-avatar {
      font-size: 40px;
      width: 55px;
      height: 55px;
      background: var(--input-bg);
      border: 2px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .chat-info { flex: 1; }

    .chat-info h3 {
      color: var(--gold);
      font-size: 16px;
      margin-bottom: 4px;
    }

    .chat-info p {
      color: var(--text-muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .chat-meta { text-align: right; }

    .chat-meta .time {
      color: var(--text-faint);
      font-size: 11px;
      margin-bottom: 6px;
    }

    .chat-meta .badge {
      background: var(--gold);
      color: var(--btn-primary-text);
      font-size: 11px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 20px;
    }

    .chat-window {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    .chat-window.open { display: flex; }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: var(--navbar-bg);
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .chat-header .back {
      font-size: 22px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .chat-header .back:hover { transform: scale(1.2); }

    .chat-header .avatar {
      font-size: 32px;
      width: 45px;
      height: 45px;
      background: var(--input-bg);
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-header .info h3 {
      color: var(--gold);
      font-size: 16px;
    }

    .chat-header .info p {
      color: #51cf66;
      font-size: 12px;
    }

    .messages {
      flex: 1;
      padding: 20px 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg);
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .msg {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .msg.received {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.sent {
      background: var(--gold);
      color: var(--btn-primary-text);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      font-weight: 500;
    }

    .msg .msg-time {
      font-size: 10px;
      margin-top: 5px;
      opacity: 0.6;
      text-align: right;
    }

    .msg.received .msg-time { text-align: left; }

    .chat-input-area {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px;
      background: var(--navbar-bg);
      border-top: 2px solid var(--border);
    }

    .chat-input-area input {
      flex: 1;
      padding: 13px 16px;
      background: var(--input-bg);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 25px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.3s;
    }

    .chat-input-area input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .chat-input-area input::placeholder { color: var(--text-faint); }

    .send-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--btn-primary-bg);
      border: none;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .send-btn:hover {
      opacity: 0.85;
      transform: scale(1.1);
    }

    .empty-chat {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-chat .icon {
      font-size: 60px;
      display: block;
      margin-bottom: 15px;
    }

    .empty-chat h3 {
      color: var(--gold);
      font-size: 20px;
      margin-bottom: 10px;
    }

    .empty-chat p { font-size: 14px; }
  </style>
</head>
