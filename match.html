<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Match - Match</title>
  <link rel="stylesheet" href="src/theme.css">
  <style>
    body {
      min-height: 100vh;
    }

    .match-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    .match-card {
      width: 100%;
      max-width: 380px;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes swipeLeft {
      to { opacity: 0; transform: translateX(-120%) rotate(-15deg); }
    }

    @keyframes swipeRight {
      to { opacity: 0; transform: translateX(120%) rotate(15deg); }
    }

    .swipe-left { animation: swipeLeft 0.4s ease forwards; }
    .swipe-right { animation: swipeRight 0.4s ease forwards; }

    .match-card-photo {
      width: 100%;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 110px;
      background: var(--input-bg);
    }

    .match-card-info { padding: 20px; }

    .match-card-info h2 {
      color: var(--gold);
      font-size: 22px;
      margin-bottom: 4px;
    }

    .match-card-info .location {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .match-card-info .bio {
      color: var(--text);
      font-size: 14px;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .match-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .action-btns {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 25px;
    }

    .action-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: none;
      font-size: 28px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .btn-skip {
      background: var(--surface);
      border: 2px solid var(--border);
    }
    .btn-skip:hover {
      background: #ff6b6b;
      border-color: #ff6b6b;
      transform: scale(1.1);
    }

    .btn-like {
      background: var(--surface);
      border: 2px solid var(--border);
    }
    .btn-like:hover {
      background: #51cf66;
      border-color: #51cf66;
      transform: scale(1.1);
    }

    .btn-super {
      background: var(--surface);
      border: 2px solid var(--border);
    }
    .btn-super:hover {
      background: var(--gold);
      border-color: var(--gold);
      transform: scale(1.1);
    }

    .no-more {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .no-more .icon {
      font-size: 60px;
      display: block;
      margin-bottom: 15px;
    }

    .no-more h3 {
      color: var(--gold);
      font-size: 22px;
      margin-bottom: 10px;
    }

    .no-more p { font-size: 14px; }

    .match-popup {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 999;
      justify-content: center;
      align-items: center;
    }

    .match-popup.show { display: flex; }

    .popup-card {
      background: var(--surface);
      border: 2px solid var(--gold);
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      max-width: 340px;
      width: 90%;
      animation: popIn 0.4s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .popup-card .icon {
      font-size: 60px;
      display: block;
      margin-bottom: 15px;
    }

    .popup-card h2 {
      color: var(--gold);
      font-size: 26px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .popup-card p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 25px;
    }

    .popup-btns {
      display: flex;
      gap: 10px;
      flex-direction: column;
    }

    .counter {
      color: var(--text-faint);
      font-size: 13px;
      margin-top: 20px;
      letter-spacing: 1px;
      text-align: center;
    }
  </style>
</head>
