<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Match - Register</title>
  <link rel="stylesheet" href="src/theme.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      padding: 40px 30px;
      width: 100%;
      max-width: 440px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo .icon {
      font-size: 42px;
      display: block;
      margin-bottom: 8px;
    }

    .logo h1 {
      font-size: 28px;
      color: var(--gold);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .logo p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 5px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: var(--text-muted);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row .form-group {
      flex: 1;
    }

    select.input {
      appearance: none;
      cursor: pointer;
    }

    .tiktok-wrap {
      position: relative;
    }

    .tiktok-wrap .prefix {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-faint);
      font-size: 14px;
      pointer-events: none;
    }

    .tiktok-wrap input {
      padding-left: 38px;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 44px;
    }

    .toggle-eye {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 18px;
      color: var(--text-faint);
      background: none;
      border: none;
      padding: 0;
    }

    .toggle-eye:hover {
      color: var(--gold);
    }

    .strength-bar {
      height: 4px;
      border-radius: 4px;
      margin-top: 6px;
      background: var(--input-bg);
      overflow: hidden;
    }

    .strength-fill {
      height: 100%;
      border-radius: 4px;
      width: 0%;
      transition: all 0.3s;
    }

    .strength-text {
      font-size: 11px;
      margin-top: 4px;
      color: var(--text-faint);
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 16px 0;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .terms input[type="checkbox"] {
      margin-top: 2px;
      accent-color: var(--gold);
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .terms a {
      color: var(--gold);
      text-decoration: none;
    }

    .terms a:hover {
      text-decoration: underline;
    }

    .link {
      text-align: center;
      margin-top: 18px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .link a {
      color: var(--gold);
      text-decoration: none;
      font-weight: bold;
    }

    .link a:hover {
      text-decoration: underline;
    }

    .divider {
      margin: 16px 0;
    }

    .step-indicator {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .step-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
      transition: all 0.3s;
    }

    .step-dot.active {
      background: var(--gold);
      width: 24px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">
      <span class="icon">👑</span>
      <h1>Join Love Match</h1>
      <p>Create your royal profile</p>
    </div>

    <div class="step-indicator">
      <div class="step-dot active" id="dot1"></div>
      <div class="step-dot" id="dot2"></div>
      <div class="step-dot" id="dot3"></div>
    </div>

    <form id="registerForm" onsubmit="return false;">

      <div class="form-group">
        <label>Full Name</label>
        <input class="input" type="text" id="regName" placeholder="Your full name">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input class="input" type="email" id="regEmail" placeholder="your@email.com">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Age</label>
          <input class="input" type="number" id="regAge" placeholder="18" min="18" max="99">
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select class="input" id="regGender">
            <option value="" disabled selected>Select</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="non-binary">Non-binary</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Location (City)</label>
        <input class="input" type="text" id="regLocation" placeholder="e.g. Durban, Cape Town">
      </div>

      <div class="form-group">
        <label>TikTok Profile Link 🎵</label>
        <div class="tiktok-wrap">
          <span class="prefix">@</span>
          <input class="input" type="text" id="regTiktok" placeholder="yourusername">
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-wrap">
          <input class="input" type="password" id="regPassword" placeholder="Create a strong password">
          <button type="button" class="toggle-eye" onclick="togglePass('regPassword', this)">👁️</button>
        </div>
        <div class="strength-bar">
          <div class="strength-fill" id="strengthFill"></div>
        </div>
        <div class="strength-text" id="strengthText"></div>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <div class="password-wrap">
          <input class="input" type="password" id="regConfirm" placeholder="Repeat your password">
          <button type="button" class="toggle-eye" onclick="togglePass('regConfirm', this)">👁️</button>
        </div>
      </div>

      <div class="terms">
        <input type="checkbox" id="termsCheck">
        <label for="termsCheck">
          I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
        </label>
      </div>

      <div class="error-msg" id="regError"></div>

      <button class="btn btn-primary" id="regBtn" onclick="handleRegister()">
        Create Account 👑
      </button>

      <div class="divider">— or —</div>

      <button class="btn btn-google" id="googleRegBtn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" style="width:20px;height:20px;">
        Continue with Google
      </button>

    </form>

    <div class="link">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>

  <script type="module">
    import { applyTheme, getTheme } from './src/theme.js';
    applyTheme(getTheme());

      db,
      provider,
      signInWithPopup,
      onAuthStateChanged,
      doc,
      setDoc,
      getDoc
    } from
